workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Scrap It Down Keys"
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cryptanaki.scrapitdown
      vars:
        # Bundle identifier must match what's in Xcode project
        BUNDLE_ID: "com.cryptanaki.scrapitdown"
    scripts:
      - name: Set up Firebase for iOS
        script: |
          # Ensure GoogleService-Info.plist is present for production
          # If using FlutterFire CLI, run: flutterfire configure --project <prod-project-id> --ios-bundle-id $BUNDLE_ID
          echo "Checking Firebase iOS config..."
          ls -la ios/Runner/GoogleService-Info.plist || echo "WARNING: GoogleService-Info.plist not found"
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Pod install
        script: |
          cd ios && pod install
      - name: Build IPA
        script: |
          # Configure automatic code signing
          cd ios
          xcodebuild -project Runner.xcodeproj \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=X89J5L95HQ \
            archive -archivePath build/Runner.xcarchive
          
          # Export IPA
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build/Runner.ipa \
            -exportOptionsPlist ../exportOptions.plist \
            -allowProvisioningUpdates
          
          # Move to expected location
          cd ..
          mkdir -p build/ios/ipa
          cp ios/build/Runner.ipa/*.ipa build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      # App Store Connect publishing
      app_store_connect:
        auth: "integration"
        submit_to_testflight: true
      email:
        recipients:
          - cryptanaki@example.com  # Replace with your email
        notify:
          success: true
          failure: true
